# Copilot Setup Steps Workflow
# This workflow demonstrates the complete setup process for the Asper Beauty Shop project
# It serves as a reference for developers using GitHub Copilot to understand the project setup
#
# Signed-off-by: Asper Beauty Shop <252395498+asperpharma@users.noreply.github.com>

name: Copilot Setup Steps

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-and-validate:
    name: Setup and Validate Project
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Step 3: Cache node_modules for faster subsequent runs
      - name: Cache node_modules
        uses: actions/cache@v5.0.3
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 5: Run TypeScript type checking
      - name: Type check
        run: npx tsc --noEmit

      # Step 6: Run ESLint
      - name: Lint code
        run: npm run lint

      # Step 7: Build the project
      - name: Build project
        run: npm run build

      # Step 8: Verify build artifacts
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          echo "Build completed successfully"
          ls -la dist

      # Step 9: Preview build (optional - for validation)
      - name: Test production build
        run: |
          echo "Production build is ready for preview"
          echo "Use 'npm run preview' locally to test the build"

  # Additional job for development environment validation
  dev-environment:
    name: Validate Development Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify development setup
        run: |
          echo "Verifying project structure..."
          test -f "vite.config.ts" && echo "✓ Vite config found"
          test -f "tsconfig.json" && echo "✓ TypeScript config found"
          test -f "tailwind.config.ts" && echo "✓ Tailwind config found"
          test -f "package.json" && echo "✓ Package.json found"
          test -d "src" && echo "✓ Source directory found"
          test -d "src/components" && echo "✓ Components directory found"
          test -d "src/pages" && echo "✓ Pages directory found"
          echo "✓ Development environment is properly configured"

      - name: Check environment variables template
        run: |
          if [ -f ".env" ]; then
            echo "✓ .env file exists"
          else
            echo "⚠ .env file not found (may be intentional for security)"
          fi

      - name: Validate project dependencies
        run: |
          echo "Checking critical dependencies..."
          npm list react react-dom vite typescript @tanstack/react-query zustand || true
          echo "✓ Dependency check complete"
